[project]
name = "models"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64"]

[dependencies]
# Core dependencies
python = ">=3.11,<3.14"
pymc = ">=5.17.0"
numpy = ">=2.0.0"
pyarrow = "*"
ipykernel = "*"
jupyterlab = "*"
seaborn = "*"
numpyro = "*"
joblib = "*"
zarr = "<3.0.0"
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"

# Additional scientific computing dependencies
pandas = "*"
matplotlib = "*"
scipy = "*"
arviz = "*"
xarray = "*"

# Development dependencies
black = "*"
isort = "*"

[tasks]
test = "pytest"
test-cov = "pytest --cov=src"
format = "black src/ tests/"
lint = "black --check src/ tests/ && isort --check-only src/ tests/"
notebook = "jupyter lab"

# Legislative forecast (the random-walk model, src/forecast_rw.py; chosen by the November 2026
# six-election backtest). `pixi run nowcast` is "if the election were held on the day of the last
# poll"; `pixi run forecast 2029-10-07` forecasts a given election day. Both write
# outputs/WIP_legislative_..._rw_<date> with run.json's gate; rename to ACCEPTED_ only if it passes.
# Extra flags go after the task: --as-of YYYY-MM-DD, --bias static (a labelled scenario only).
nowcast = "python -m src.forecast_rw --draws 2000 --tune 2000"
forecast = "python -m src.forecast_rw --draws 2000 --tune 2000 --target"

# The earlier GP model (src.main), kept for comparison. No election is scheduled, so it trains on
# the placeholder date 2029-10-07 (every current poll sits outside its 90-day campaign window).
train = "python -m src.main --mode train --model-type dynamic_gp --election-date 2029-10-07 --output-dir outputs --draws 1000 --tune 1000"
viz = "python -m src.main --mode viz --load-dir outputs/latest"
diagnose = "python -m src.main --mode diagnose --load-dir outputs/latest"
predict = "python -m src.main --mode predict --load-dir outputs/latest"
nowcast-gp = "python -m src.main --mode predict --load-dir outputs/latest --prediction-date-mode last_poll"
municipal-train = "python -m src.main --mode municipal-train --draws 1000 --tune 1000"

# Presidential model commands
presidential-train = "python -m src.main --mode presidential-train --draws 1000 --tune 1000"
presidential-export = "python scripts/export_presidential_dashboard.py"
presidential-export-web = "python scripts/export_presidential_dashboard.py --copy-to-web"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[feature.dev.dependencies]
# Additional development tools
pre-commit = "*"
mypy = "*"
